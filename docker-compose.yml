services:
  db:
    image: postgis/postgis:16-3.4
    container_name: parcel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cadastre
      POSTGRES_USER: cadastre
      POSTGRES_PASSWORD: cadastre
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastre -d cadastre"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./api
    container_name: parcel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: cadastre
      PGUSER: cadastre
      PGPASSWORD: cadastre
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    build:
      context: ./web
    container_name: parcel-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
