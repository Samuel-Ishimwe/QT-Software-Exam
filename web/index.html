<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cadastral Parcel Viewer</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.30/"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; font-size: 13px; }
    #viewDiv { position: absolute; top: 0; bottom: 0; left: 320px; right: 0; }
    #panel { position: absolute; top: 0; bottom: 0; left: 0; width: 320px; overflow-y: auto; padding: 10px; box-sizing: border-box; background: #f5f5f5; border-right: 1px solid #ccc; }
    #panel h2 { font-size: 14px; margin: 12px 0 4px; }
    #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 4px; }
    #panel button { margin-top: 4px; padding: 4px 8px; }
    #detail, #lineage, #status { white-space: pre-wrap; font-family: monospace; font-size: 11px; background: #fff; border: 1px solid #ddd; padding: 6px; margin-top: 6px; max-height: 220px; overflow-y: auto; }
    label { display: block; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="panel">
    <h2>Cadastral Parcel Viewer</h2>
    <div id="status">loading map...</div>

    <label><input type="checkbox" id="publicToggle" /> Public (citizen) view — no holder identity</label>

    <h2>Search by UPI</h2>
    <input type="text" id="upiInput" placeholder="e.g. 1/1/1/1000" />
    <button id="searchBtn">Search &amp; zoom</button>

    <h2>Selected parcel</h2>
    <div id="detail">click a parcel, or search by UPI</div>

    <h2>Lineage</h2>
    <button id="lineageBtn" disabled>Show lineage of selected parcel</button>
    <div id="lineage"></div>
  </div>
  <div id="viewDiv"></div>

  <script src="app.js"></script>
</body>
</html>
